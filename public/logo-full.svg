<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Edimo Le Bayeur">
  <title>Edimo Le Bayeur</title>

  <!--
    EDIMO LE BAYEUR — logo complet (vertical)
    Layout: mark centré en haut, puis "EDIMO" (noir, ligne 1)
    et "LE BAYEUR" (gold, ligne 2, tracking large) centrés en dessous.
  -->

  <!-- Mark : centré horizontalement (400 - 200) / 2 = 100 -->
  <g transform="translate(100,20)">
    <!-- Silhouette maison -->
    <path
      d="M100,30 L165,85 L165,175 L35,175 L35,85 Z"
      fill="#1a1a1a"
    />
    <!-- Porte en arc, accent gold -->
    <path
      d="M80,175 L80,140 A20,20 0 0 1 120,140 L120,175 Z"
      fill="#D4AF37"
    />
  </g>

  <!-- Ligne 1 : "EDIMO" en noir, gras -->
  <text
    x="200"
    y="270"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="56"
    letter-spacing="3"
    fill="#1a1a1a"
  >EDIMO</text>

  <!-- Ligne 2 : "LE BAYEUR" en gold, tracking large (style sous-titre) -->
  <text
    x="200"
    y="305"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="600"
    font-size="26"
    letter-spacing="6"
    fill="#D4AF37"
  >LE BAYEUR</text>
</svg>
