<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Edimo">
  <title>Edimo</title>

  <!--
    EDIMO LE BAYEUR — logo horizontal
    Layout: mark (200x200) à gauche + wordmark "EDIMO" en noir à droite,
    alignés sur le centre vertical du mark (y=100).
  -->

  <!-- Mark : même géométrie que logo-mark.svg -->
  <g>
    <!-- Silhouette maison -->
    <path
      d="M100,30 L165,85 L165,175 L35,175 L35,85 Z"
      fill="#1a1a1a"
    />
    <!-- Porte en arc, accent gold -->
    <path
      d="M80,175 L80,140 A20,20 0 0 1 120,140 L120,175 Z"
      fill="#D4AF37"
    />
  </g>

  <!-- Wordmark : "EDIMO" en noir, centré verticalement sur le mark -->
  <text
    x="230"
    y="132"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="88"
    letter-spacing="4"
    fill="#1a1a1a"
  >EDIMO</text>
</svg>
